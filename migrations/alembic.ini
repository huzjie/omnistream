# Alembic 配置（WS2 独占，位于 migrations/ 目录内）
#
#   alembic -c migrations/alembic.ini upgrade head
#   alembic -c migrations/alembic.ini revision -m "add xxx" --autogenerate
#
# sqlalchemy.url 会被 migrations/env.py 用 OMS_STORAGE__DATABASE_URL 覆盖，
# 这里的值仅作为无任何配置时的兜底（SQLite 零依赖）。

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = sqlite+aiosqlite:///./data/omnistream.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
